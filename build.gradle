plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ocenering'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

// Java4Shell (CVE-2026-114938): a malformed Base64 string can corrupt memory in the JDK's own Base64
// decoder and lead to remote code execution. Fixed in Java 27.0.1.1, so refuse to build on anything older.
def minimumSafeJava = Runtime.Version.parse('27.0.1.1')
def toolchainJava = javaToolchains.launcherFor(java.toolchain).get().metadata.javaRuntimeVersion

if (Runtime.Version.parse(toolchainJava).compareToIgnoreOptional(minimumSafeJava) < 0) {
	throw new GradleException("Java ${toolchainJava} is affected by Java4Shell (CVE-2026-114938). " +
		"Install Java ${minimumSafeJava} or later and try again.")
}

ext {
	icebergVersion = '1.10.0'
}

repositories {
	mavenCentral()
}

// House style (blank lines between blocks): config/checkstyle/checkstyle.xml. Fails `./gradlew check`.
checkstyle {
	toolVersion = '10.21.4'
	maxWarnings = 0
	ignoreFailures = false
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Scans: Iceberg REST catalog + S3FileIO (LocalStack in dev). Data files are written as Avro,
	// which keeps Hadoop/Parquet off the classpath.
	implementation "org.apache.iceberg:iceberg-core:${icebergVersion}"
	implementation "org.apache.iceberg:iceberg-data:${icebergVersion}"
	implementation "org.apache.iceberg:iceberg-aws:${icebergVersion}"
	runtimeOnly "org.apache.iceberg:iceberg-aws-bundle:${icebergVersion}"
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
