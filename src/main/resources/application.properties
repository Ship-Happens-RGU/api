spring.application.name=api

# Docker Compose
spring.docker.compose.readiness.wait=only-if-started

# Database Migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Local secrets & environment configuration
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.forward-headers-strategy=framework

# Auth properties
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.admin-email=${ADMIN_EMAIL:admin@ocenering.com}
app.auth.admin-password=${ADMIN_PASSWORD:adminpassword123}
app.auth.session-ttl-hours=${SESSION_TTL_HOURS:12}
app.auth.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
app.auth.lock-duration-minutes=${LOCK_DURATION_MINUTES:15}
app.auth.min-password-length=${MIN_PASSWORD_LENGTH:12}

# Scan uploads (point clouds can be large)
spring.servlet.multipart.max-file-size=${SCAN_MAX_FILE_SIZE:20GB}
spring.servlet.multipart.max-request-size=${SCAN_MAX_FILE_SIZE:20GB}
spring.servlet.multipart.file-size-threshold=16MB

# Scans: Apache Iceberg (REST catalog) on S3 (LocalStack in dev)
app.iceberg.catalog-uri=${ICEBERG_CATALOG_URI:http://localhost:8181}
app.iceberg.warehouse=${ICEBERG_WAREHOUSE:s3://warehouse/}
app.iceberg.namespace=${ICEBERG_NAMESPACE:shiphappens}
app.iceberg.table=${ICEBERG_SCANS_TABLE:scans}
app.iceberg.s3-endpoint=${S3_ENDPOINT:http://localhost:4566}
app.iceberg.s3-access-key=${S3_ACCESS_KEY:admin}
app.iceberg.s3-secret-key=${S3_SECRET_KEY:password123}
app.iceberg.region=${AWS_REGION:us-east-1}
