services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'

  spark-master:
    image: 'apache/spark:latest'
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    ports:
      - '9090:8080'
      - '7077:7077'

  spark-worker:
    image: 'apache/spark:latest'
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    ports:
      - '8081:8081'

  minio:
    image: 'cgr.dev/chainguard/minio:latest'
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    ports:
      - '4566:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
    healthcheck:
      test: ['CMD', '/usr/bin/mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: 'cgr.dev/chainguard/minio:latest'
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /usr/bin/bash
      - -c
      - >
        /usr/bin/mc alias set myminio http://minio:9000 admin password123;
        /usr/bin/mc mb --ignore-existing myminio/warehouse;
        exit 0;

  iceberg-rest:
    image: 'apache/iceberg-rest-fixture:latest'
    container_name: iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '8181:8181'
    volumes:
      - 'iceberg_catalog_data:/tmp'
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_S3_ACCESS__KEY__ID=admin
      - CATALOG_S3_SECRET__ACCESS__KEY=password123
      - CATALOG_CLIENT_REGION=us-east-1

volumes:
  minio_data:
  iceberg_catalog_data:



